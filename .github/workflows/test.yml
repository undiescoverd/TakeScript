name: Test

on:
  push:
    branches: [main, Fixes]
  pull_request:
    branches: [main, Fixes]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Convex types (mock for CI)
        run: |
          mkdir -p convex/_generated
          cat > convex/_generated/api.d.ts << 'EOF'
          declare const api: any;
          export { api };
          EOF
          cat > convex/_generated/api.js << 'EOF'
          // Mock Convex API for CI environments
          const createMockFunctionReference = () => ({
            _name: 'mock',
            toString: () => 'mock:function'
          });

          const createMockNamespace = () => new Proxy({}, {
            get: () => createMockFunctionReference()
          });

          export const api = new Proxy({}, {
            get: (target, prop) => {
              if (!(prop in target)) {
                target[prop] = createMockNamespace();
              }
              return target[prop];
            }
          });
          EOF
          cat > convex/_generated/dataModel.d.ts << 'EOF'
          export type Id<T extends string> = string & { __tableName: T };
          export type Doc<T extends string> = any;
          export declare const Id: any;
          export declare const Doc: any;
          EOF
          cat > convex/_generated/dataModel.js << 'EOF'
          export const Id = (id) => id;
          export const Doc = {};
          EOF

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Generate coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov (optional)
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Convex types (mock for CI)
        run: |
          mkdir -p convex/_generated
          cat > convex/_generated/api.d.ts << 'EOF'
          declare const api: any;
          export { api };
          EOF
          cat > convex/_generated/api.js << 'EOF'
          // Mock Convex API for CI environments
          const createMockFunctionReference = () => ({
            _name: 'mock',
            toString: () => 'mock:function'
          });

          const createMockNamespace = () => new Proxy({}, {
            get: () => createMockFunctionReference()
          });

          export const api = new Proxy({}, {
            get: (target, prop) => {
              if (!(prop in target)) {
                target[prop] = createMockNamespace();
              }
              return target[prop];
            }
          });
          EOF
          cat > convex/_generated/dataModel.d.ts << 'EOF'
          export type Id<T extends string> = string & { __tableName: T };
          export type Doc<T extends string> = any;
          export declare const Id: any;
          export declare const Doc: any;
          EOF
          cat > convex/_generated/dataModel.js << 'EOF'
          export const Id = (id) => id;
          export const Doc = {};
          EOF

      - name: Build application
        run: npm run build
        env:
          # Mock environment variables for build
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Check TypeScript
        run: npx tsc --noEmit

  # Optional: Deploy preview for PRs
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [test, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
