version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "undiescoverd"
    labels:
      - "dependencies"
      - "automated"
    # Group updates to reduce PR noise
    groups:
      # Group all patch and minor updates together
      production-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Keep major updates separate (require review)
      major-updates:
        patterns:
          - "*"
        update-types:
          - "version-update:semver-major"
    # Prioritize security updates
    commit-message:
      prefix: "chore"
      include: "scope"
    # Ignore specific packages if needed (uncomment and add package names)
    # ignore:
    #   - dependency-name: "package-name"
    #     update-types: ["version-update:semver-major"]

